<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1800px;background:#6d28d9;color:#fff;font-family:"Arial Rounded MT Bold","Segoe UI Black",sans-serif;padding:110px 110px 120px;display:flex;flex-direction:column;justify-content:space-between;text-transform:lowercase;position:relative;overflow:hidden}

.h{font-size:230px;line-height:1.02;letter-spacing:-2px}
.s{font-size:110px;margin-top:80px;color:#f5f3ff}
.f{font-size:44px;line-height:1.25;display:flex;flex-direction:column;gap:6px}

.row{display:flex;justify-content:space-between;align-items:flex-end}.qr{background:#fff;border-radius:22px;padding:14px 14px 8px;display:flex;flex-direction:column;align-items:center;transform:rotate(3deg)}.qr img{width:240px;height:240px;display:block}.qr span{color:#6d28d9;font-size:30px;margin-top:2px}.f{font-size:40px!important}</style></head><body>
<div style="flex:1;display:flex;flex-direction:column;justify-content:center"><div class="h">mom’s<br>not here.</div><div class="s">but we are.</div></div>
<div class="row"><div class="f">laundry, food, cleaning, errands<br>&amp; everything else — on<b>unimade</b></div><div class="qr"><img src="qr.svg"><span>scan me</span></div></div>
</body></html>
