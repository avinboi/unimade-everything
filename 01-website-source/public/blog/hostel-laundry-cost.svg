<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b2e"/><stop offset="1" stop-color="#050506"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1600" height="1000" fill="url(#g)"/>
<circle cx="1450" cy="120" r="220" fill="#a855f7" opacity=".12"/><circle cx="120" cy="930" r="180" fill="#22d3ee" opacity=".08"/>
<text x="90" y="120" font-size="34" fill="#c4b5fd" font-style="italic">saving money in college</text>
<text x="90" y="200" font-size="64" font-weight="800" fill="#f4f1ea">How Much Does Laundry Cost</text><text x="90" y="272" font-size="64" font-weight="800" fill="#f4f1ea">in a Hostel? (2026)</text>
<path d="M90 302 q 60 -18 120 0 t 120 0 t 120 0" stroke="url(#a)" stroke-width="7" fill="none" stroke-linecap="round"/>
<text x="90" y="400" font-size="34" fill="#a1a1aa">one student, one month = about 8 kg of laundry</text>
<rect x="90" y="450" width="440" height="400" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#a855f7" stroke-opacity=".55" stroke-width="2"/>
<text x="130" y="520" font-size="34" font-weight="600" fill="#c4b5fd">Hand-wash</text>
<text x="130" y="640" font-size="96" font-weight="800" fill="#f4f1ea">₹100</text>
<text x="130" y="700" font-size="32" fill="#a1a1aa">detergent</text>
<text x="130" y="800" font-size="40" font-weight="700" fill="#f472b6">+ 8 hours</text>
<rect x="580" y="450" width="440" height="400" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#67e8f9" stroke-opacity=".55" stroke-width="2"/>
<text x="620" y="520" font-size="34" font-weight="600" fill="#67e8f9">Laundry service</text>
<text x="620" y="640" font-size="96" font-weight="800" fill="#f4f1ea">₹470–600</text>
<text x="620" y="700" font-size="32" fill="#a1a1aa">at ₹59–75 per kg</text>
<text x="620" y="800" font-size="40" font-weight="700" fill="#4ade80">+ 0 hours</text>
<rect x="1070" y="450" width="440" height="400" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#facc15" stroke-opacity=".55" stroke-width="2"/>
<text x="1110" y="520" font-size="34" font-weight="600" fill="#facc15">Monthly plan</text>
<text x="1110" y="640" font-size="96" font-weight="800" fill="#f4f1ea">10–20%</text>
<text x="1110" y="700" font-size="32" fill="#a1a1aa">cheaper than per order</text>
<text x="1110" y="800" font-size="40" font-weight="700" fill="#4ade80">fix a laundry day</text>
<text x="1510" y="960" text-anchor="end" font-size="28" font-weight="700" fill="#c4b5fd">unimade</text></svg>
