<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b2e"/><stop offset="1" stop-color="#050506"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="1600" height="1000" fill="url(#g)"/>
<circle cx="1450" cy="120" r="220" fill="#a855f7" opacity=".12"/><circle cx="120" cy="930" r="180" fill="#22d3ee" opacity=".08"/>
<text x="90" y="120" font-size="34" fill="#c4b5fd" font-style="italic">hostel life tips</text>
<text x="90" y="200" font-size="64" font-weight="800" fill="#f4f1ea">Hostel Life Tips</text>
<path d="M90 230 q 60 -18 120 0 t 120 0 t 120 0" stroke="url(#a)" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="90" y="330" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#a855f7" stroke-opacity=".55" stroke-width="2"/>
<circle cx="160" cy="415" r="40" fill="#a855f7"/><text x="160" y="430" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">1</text>
<text x="230" y="429" font-size="38" font-weight="600" fill="#f4f1ea">Pack less than you think</text><rect x="820" y="330" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#67e8f9" stroke-opacity=".55" stroke-width="2"/>
<circle cx="890" cy="415" r="40" fill="#67e8f9"/><text x="890" y="430" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">2</text>
<text x="960" y="407" font-size="38" font-weight="600" fill="#f4f1ea">Carry copies of your</text><text x="960" y="451" font-size="38" font-weight="600" fill="#f4f1ea">documents</text><rect x="90" y="524" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#f472b6" stroke-opacity=".55" stroke-width="2"/>
<circle cx="160" cy="609" r="40" fill="#f472b6"/><text x="160" y="624" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">3</text>
<text x="230" y="601" font-size="38" font-weight="600" fill="#f4f1ea">Talk to your roommate</text><text x="230" y="645" font-size="38" font-weight="600" fill="#f4f1ea">early</text><rect x="820" y="524" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#facc15" stroke-opacity=".55" stroke-width="2"/>
<circle cx="890" cy="609" r="40" fill="#facc15"/><text x="890" y="624" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">4</text>
<text x="960" y="623" font-size="38" font-weight="600" fill="#f4f1ea">Keep a snack stash</text><rect x="90" y="718" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#4ade80" stroke-opacity=".55" stroke-width="2"/>
<circle cx="160" cy="803" r="40" fill="#4ade80"/><text x="160" y="818" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">5</text>
<text x="230" y="817" font-size="38" font-weight="600" fill="#f4f1ea">Fix a laundry day</text><rect x="820" y="718" width="680" height="170" rx="28" fill="#ffffff" fill-opacity=".05" stroke="#fb923c" stroke-opacity=".55" stroke-width="2"/>
<circle cx="890" cy="803" r="40" fill="#fb923c"/><text x="890" y="818" text-anchor="middle" font-size="42" font-weight="800" fill="#050506">6</text>
<text x="960" y="817" font-size="38" font-weight="600" fill="#f4f1ea">Clean a little, every day</text><text x="1510" y="960" text-anchor="end" font-size="28" font-weight="700" fill="#c4b5fd">unimade</text></svg>